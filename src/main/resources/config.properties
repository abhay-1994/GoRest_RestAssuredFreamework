# ---------------------------------------------------------------
# GoREST API - framework configuration
# Any key here can be overridden at run time:
#   mvn test -Dtoken=<your-token>
#   set TOKEN=<your-token>   (env var, dots -> underscores, upper case)
# ---------------------------------------------------------------

base.uri=https://gorest.co.in
base.path=/public/v2

# Personal access token from https://gorest.co.in/consumer/login
# Needed only for POST / PUT / PATCH / DELETE. Read-only tests run without it.
token=Your_Token_Here

# Log every request/response to target/logs/api.log
log.requests=true

# Response-time budget asserted by the response specification
max.response.time.ms=10000
